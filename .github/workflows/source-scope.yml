name: Frozen vendor documentation additions scope
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frozen-vendor-documentation-source:
    name: frozen-vendor-documentation-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      BOOTSTRAP_BASE_SHA: cd2f8121313e99a1724274f80614926f8c1960e9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate documentation, contract semantics and fail-closed source scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          source_ci="$RUNNER_TEMP/trusted-source-ci"
          mkdir -p "$source_ci"
          if git cat-file -e "$BASE_SHA:.github/source-scope.json" 2>/dev/null; then
            git diff --exit-code "$BASE_SHA" -- .github governance/interim-release-policy.json
            git archive "$BASE_SHA" .github | tar -x -C "$source_ci"
          else
            test "$BASE_SHA" = "$BOOTSTRAP_BASE_SHA"
            cp -R .github "$source_ci/"
          fi
          python -m pip install --disable-pip-version-check --no-cache-dir -r "$source_ci/.github/requirements-source-scope.txt"
          python -m unittest discover -s "$source_ci/.github/scripts" -p 'test_*.py'
          python "$source_ci/.github/scripts/validate_source_scope.py"
          python "$source_ci/.github/scripts/check_owned_sidecar.py"
      - name: Scan complete effective tree and tracked history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          set +e
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --exit-code 1 --report-format json --report-path "$RUNNER_TEMP/history-secrets.json" .
          history_status=$?
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact=100 --exit-code 1 --report-format json --report-path "$RUNNER_TEMP/tree-secrets.json" .
          tree_status=$?
          set -e
          python - <<'PYSCAN'
          import json, os
          from pathlib import Path
          for name in ('history-secrets.json', 'tree-secrets.json'):
              findings = json.loads((Path(os.environ['RUNNER_TEMP']) / name).read_text())
              for item in findings:
                  print('SECRET_SCAN_METADATA=' + json.dumps({key: item.get(key) for key in ('RuleID', 'File', 'StartLine', 'Commit', 'Fingerprint')}, sort_keys=True))
              print('SECRET_SCAN_COUNT=' + name + ':' + str(len(findings)))
          PYSCAN
          test "$history_status" -eq 0
          test "$tree_status" -eq 0
      - name: Reject an adjacent generated credential with the same scanner
        shell: bash
        run: |
          set -euo pipefail
          regression="$RUNNER_TEMP/generated-credential-regression"
          mkdir -p "$regression"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$regression/adjacent-key.pem" 2>/dev/null
          set +e
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact=100 --exit-code 1 "$regression"
          status=$?
          set -e
          test "$status" -eq 1
          echo 'UNKNOWN_ADJACENT_CREDENTIAL_REJECTION=PASS'
